# Your real layout for the CH57x macropad (USB 1189:8840, model ch57x-1).
# This file is the SOLE source of truth — the tool cannot read the map back
# off the device. Edit here, then:
#   ./ch57x-keyboard-tool validate your-config.yaml
#   ./ch57x-keyboard-tool upload   your-config.yaml   (may need sudo)
#
# See doc/actions.md for all available actions.

model: ch57x-1

# Buttons on the left, knobs on the right.
orientation: normal
rows: 3
columns: 4
knobs: 2

layers:
  # ---- Layer 1: everyday editing shortcuts ----
  - buttons:
      - ["ctrl-c", "ctrl-v", "ctrl-x", "ctrl-z"]      # copy, paste, cut, undo
      - ["ctrl-a", "ctrl-s", "ctrl-f", "ctrl-shift-z"] # select-all, save, find, redo
      - ["ctrl-t", "ctrl-w", "alt-tab", "ctrl-shift-t"] # new tab, close, switch, reopen tab
    knobs:
      # Top knob: volume
      - ccw: "volumedown"
        press: "mute"
        cw: "volumeup"
      # Bottom knob: bedroom_lights_dimmer
      - ccw: "f16"
        press: "f15"
        cw: "f14"

  # ---- Layer 2: WiZ light control (via host daemon on safe F-codes) ----
  # Far-right column = single-value dimmer. Far-left column = full on/off.
  # Only f14-f18 are used: they map to inert XF86Launch5-9 on this machine.
  # f13 fillers are unassigned placeholders. See docs/ai/wiz-lights.md.
  - buttons:
      - ["f17", "f13", "f13", "f14"]   # always-on | - | - | BRIGHTER (top-right)
      - ["f13", "f13", "f13", "f15"]   #    -      | - | - | TOGGLE on/off (mid-right)
      - ["f18", "f13", "f13", "f16"]   # always-off| - | - | SOFTER (bottom-right)
    knobs:
      # Top knob: volume
      - ccw: "volumedown"
        press: "mute"
        cw: "volumeup"
      # Bottom knob: bedroom_lights_dimmer
      - ccw: "f16"
        press: "f15"
        cw: "f14"

  # ---- Layer 3: numpad + media ----
  - buttons:
      - ["7", "8", "9", "prev"]
      - ["4", "5", "6", "play"]
      - ["1", "2", "3", "next"]
    knobs:
      # Top knob: volume
      - ccw: "volumedown"
        press: "mute"
        cw: "volumeup"
      # Bottom knob: bedroom_lights_dimmer
      - ccw: "f16"
        press: "f15"
        cw: "f14"
